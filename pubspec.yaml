name: hifz
description: "An app for Quran memorization and revision."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/quran_fonts/
    - assets/tajweed/
    - assets/tafsir/
    - android/app/src/main/assets/quran-asr/LICENSE
    - android/app/src/main/assets/quran-asr/SHERPA-LICENSE
    - android/app/src/main/assets/quran-asr/ONNXRUNTIME-LICENSE
    - android/app/src/main/assets/quran-asr/ONNXRUNTIME-ThirdPartyNotices.txt
